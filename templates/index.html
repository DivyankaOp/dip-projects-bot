<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PMS Sheet Assistant</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --bubble-user:#2563eb; --bubble-bot:#1f2430;
    --text:#e6e8ee; --muted:#8b93a5; --accent:#22c55e; --border:#262b36;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:'Segoe UI', system-ui, -apple-system, sans-serif;
    background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column;
  }
  header{
    padding:16px 20px; background:var(--panel); border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:10px; justify-content:space-between;
  }
  header .left{display:flex; align-items:center; gap:10px;}
  header .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);}
  header h1{font-size:16px; margin:0; font-weight:600;}
  header p{margin:0; font-size:12px; color:var(--muted);}
  #clearBtn{
    background:transparent; border:1px solid var(--border); color:var(--muted);
    font-size:12px; padding:6px 12px; border-radius:8px; cursor:pointer;
  }
  #clearBtn:hover{color:#fff; border-color:#dc2626;}
  #chat{
    flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px;
  }
  .msg{max-width:75%; padding:12px 15px; border-radius:14px; line-height:1.5; font-size:14.5px;}
  .user{align-self:flex-end; background:var(--bubble-user); color:white; border-bottom-right-radius:4px; white-space:pre-wrap;}
  .bot{align-self:flex-start; background:var(--bubble-bot); border:1px solid var(--border); border-bottom-left-radius:4px; max-width:92%;}
  .bot p{margin:0 0 8px 0;}
  .bot p:last-child{margin-bottom:0;}
  .bot ul, .bot ol{margin:6px 0; padding-left:20px;}
  .bot strong{color:#fff;}
  .bot-table-wrap{overflow-x:auto; margin:8px 0;}
  .bot table{border-collapse:collapse; width:100%; font-size:13.5px;}
  .bot th, .bot td{border:1px solid var(--border); padding:6px 10px; text-align:left; white-space:nowrap;}
  .bot th{background:#262b36; color:#fff; font-weight:600;}
  .bot tr:nth-child(even) td{background:#1a1e27;}
  .bot code{background:#0f1115; padding:2px 5px; border-radius:4px; font-size:13px;}
  .badge{display:inline-block; padding:3px 10px; border-radius:5px; font-weight:700; font-size:12.5px;}
  .badge-pending{background:#dc2626; color:#fff;}
  .badge-leave{background:#f9c6c9; color:#7a1f1f;}
  .badge-ontime, .badge-present{background:#16a34a; color:#fff;}
  .badge-late{background:#f59e0b; color:#1a1a1a;}
  .sources{font-size:11px; color:var(--muted); margin-top:6px;}
  .typing{align-self:flex-start; color:var(--muted); font-size:13px; padding:0 15px;}
  form{
    display:flex; gap:10px; padding:16px 20px; background:var(--panel); border-top:1px solid var(--border);
  }
  input{
    flex:1; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
    background:#0f1115; color:var(--text); font-size:14.5px; outline:none;
  }
  input:focus{border-color:var(--bubble-user);}
  button{
    padding:12px 20px; border-radius:10px; border:none; background:var(--bubble-user);
    color:white; font-weight:600; cursor:pointer; font-size:14px;
  }
  button:disabled{opacity:0.5; cursor:not-allowed;}
  #micBtn{
    padding:12px 16px; border-radius:10px; border:1px solid var(--border);
    background:#0f1115; color:var(--text); cursor:pointer; font-size:16px;
  }
  #micBtn.listening{background:#dc2626; border-color:#dc2626; color:#fff; animation:pulse 1s infinite;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:0.6;}100%{opacity:1;}}
  .pdf-btn{
    margin-top:10px; display:inline-flex; align-items:center; gap:6px;
    background:#dc2626; color:#fff; border:none; padding:7px 14px;
    border-radius:8px; font-size:12.5px; font-weight:600; cursor:pointer;
  }
  .pdf-btn:hover{background:#b91c1c;}
</style>
</head>
<body>
  <header>
    <div class="left">
      <div class="dot"></div>
      <div>
        <h1>PMS Sheet Assistant</h1>
        <p>Live Google Sheets data + Gemini AI</p>
      </div>
    </div>
    <button id="clearBtn" type="button">🗑️ Chat clear karo</button>
  </header>

  <div id="chat"></div>

  <form id="form">
    <input id="input" type="text" placeholder="Apna sawaal likho... (jaise: TAJ VIVANTA HOTEL ki latest drawings kya hain?)" autocomplete="off" />
    <button id="micBtn" type="button" title="Bol kar poocho">🎤</button>
    <button id="sendBtn" type="submit">Bhejo</button>
  </form>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const clearBtn = document.getElementById('clearBtn');

const SESSION_KEY = 'pms_session_id';
const HISTORY_KEY = 'pms_chat_history';

// Session ID ek baar banega aur localStorage mein save rahega -- taaki
// "add task" jaisi multi-turn conversation reload ke baad bhi chalti rahe
let sessionId = localStorage.getItem(SESSION_KEY);
if (!sessionId) {
  sessionId = (crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now());
  localStorage.setItem(SESSION_KEY, sessionId);
}

function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveHistory(history) {
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
  } catch (e) {
    // storage full ya blocked -- chup chaap ignore karo
  }
}

let history = loadHistory();

// Table ke andar PENDING / LEAVE / LATE / ON TIME jaise words ko colored badge bana do
// (bilkul tumhari attendance PDF report jaisa look)
function highlightStatusCells(root) {
  root.querySelectorAll('td').forEach(td => {
    const t = td.textContent.trim().toUpperCase();
    let cls = null;
    if (t === 'PENDING') cls = 'badge-pending';
    else if (t === 'LEAVE') cls = 'badge-leave';
    else if (t === 'LATE') cls = 'badge-late';
    else if (t === 'ON TIME' || t === 'ONTIME' || t === 'PRESENT') cls = 'badge-ontime';
    if (cls) {
      td.innerHTML = `<span class="badge ${cls}">${td.textContent.trim()}</span>`;
    }
  });
}

// Table ko PDF file ke roop mein download karta hai
function addPdfButton(container, tableEl, title) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'pdf-btn';
  btn.textContent = '📄 PDF download karo';
  btn.addEventListener('click', () => {
    try {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const rows = [];
      const head = [];
      tableEl.querySelectorAll('thead th').forEach(th => head.push(th.textContent.trim()));
      tableEl.querySelectorAll('tbody tr').forEach(tr => {
        const row = [];
        tr.querySelectorAll('td').forEach(td => row.push(td.textContent.trim()));
        rows.push(row);
      });
      doc.setFontSize(13);
      doc.text(title || 'PMS Report', 14, 15);
      doc.autoTable({ head: [head], body: rows, startY: 20, styles: { fontSize: 8 } });
      doc.save((title || 'pms-report').replace(/[^a-z0-9]/gi, '_') + '.pdf');
    } catch (e) {
      alert('PDF banane mein error aayi: ' + e.message);
    }
  });
  container.appendChild(btn);
}

function addMsg(text, cls, sources, skipSave) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  if (cls === 'bot') {
    // Bot ka jawab markdown ho sakta hai (tables, bold, lists) -- usko HTML mein render karo
    div.innerHTML = marked.parse(text);
    // Table ko horizontally scrollable wrapper mein daal do (mobile ke liye)
    div.querySelectorAll('table').forEach(t => {
      const wrap = document.createElement('div');
      wrap.className = 'bot-table-wrap';
      t.parentNode.insertBefore(wrap, t);
      wrap.appendChild(t);
    });
    highlightStatusCells(div);
    // Agar table hai to PDF download button bhi dikhao
    const firstTable = div.querySelector('table');
    if (firstTable) {
      addPdfButton(div, firstTable, 'PMS Report');
    }
  } else {
    div.textContent = text;
  }
  if (sources && sources.length) {
    const s = document.createElement('div');
    s.className = 'sources';
    s.textContent = '📄 Source: ' + sources.join(', ');
    div.appendChild(s);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;

  if (!skipSave) {
    history.push({ text, cls, sources: sources || [] });
    saveHistory(history);
  }
  return div;
}

clearBtn.addEventListener('click', () => {
  if (!confirm('Poori chat history clear kar du?')) return;
  history = [];
  saveHistory(history);
  localStorage.removeItem(SESSION_KEY);
  chat.innerHTML = '';
  location.reload();
});

// ---------------- Voice input (Web Speech API) ----------------
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
  const recognition = new SpeechRecognition();
  recognition.lang = 'en-IN';       // Hinglish/English (Indian accent) samajhne ke liye
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  let listening = false;

  micBtn.addEventListener('click', () => {
    if (listening) {
      recognition.stop();
      return;
    }
    try {
      recognition.start();
      listening = true;
      micBtn.classList.add('listening');
      micBtn.textContent = '⏺️';
    } catch (e) {
      // already started ya koi aur error -- chup chaap ignore karo
    }
  });

  recognition.addEventListener('result', (e) => {
    const transcript = e.results[0][0].transcript;
    input.value = (input.value ? input.value + ' ' : '') + transcript;
    input.focus();
  });

  recognition.addEventListener('end', () => {
    listening = false;
    micBtn.classList.remove('listening');
    micBtn.textContent = '🎤';
  });

  recognition.addEventListener('error', () => {
    listening = false;
    micBtn.classList.remove('listening');
    micBtn.textContent = '🎤';
  });
} else {
  micBtn.disabled = true;
  micBtn.title = 'Voice input sirf Chrome/Edge browser mein kaam karta hai';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  addMsg(question, 'user');
  input.value = '';
  sendBtn.disabled = true;

  const typing = document.createElement('div');
  typing.className = 'typing';
  typing.textContent = 'Sheet check ho rahi hai...';
  chat.appendChild(typing);
  chat.scrollTop = chat.scrollHeight;

  try {
    const res = await fetch('/api/ask', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question, session_id: sessionId})
    });
    const data = await res.json();
    typing.remove();
    if (data.error) {
      addMsg('Error: ' + data.error, 'bot');
    } else {
      addMsg(data.answer, 'bot', data.sources);
    }
  } catch (err) {
    typing.remove();
    addMsg('Kuch गलत हो गया: ' + err.message, 'bot');
  }
  sendBtn.disabled = false;
  input.focus();
});

// Page load hote hi purani chat history restore karo, warna welcome message dikhao
if (history.length > 0) {
  history.forEach(m => addMsg(m.text, m.cls, m.sources, true));
} else {
  addMsg('Namaste! Mujhse PMS 3.2 ya 1 june sheet se related koi bhi sawaal pooch sakte ho.', 'bot');
}
</script>
</body>
</html>
